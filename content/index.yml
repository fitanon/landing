seo:
  title: Fitanon — Anonymous Fitness Tracking
  description: Track your workouts, set personal goals, and achieve real results — all without ever sharing your identity. Privacy-first fitness for everyone.
title: Your fitness journey, [your private story]{.text-primary}
description: Track workouts, set goals, and achieve real results without ever sharing your identity. Privacy-first fitness powered by AI.
hero:
  links:
    - label: Start for free
      icon: i-lucide-arrow-right
      trailing: true
      color: primary
      to: '#pricing'
      size: xl
    - label: See how it works
      icon: i-lucide-play-circle
      size: xl
      color: neutral
      variant: outline
      to: '#steps'
section:
  title: '[Privacy-first]{.text-primary} fitness tracking, redefined'
  description: Stay in full control of your data while unlocking powerful AI-driven insights and personalized workout plans — no account required, no personal data stored.
  images:
    mobile: '/images/macbook-mobile.svg'
    desktop: '/images/macbook.svg'
  features:
    - title: Anonymous by design
      description: Create a profile with zero personally identifiable information. Your workouts are yours alone — we never store names, emails, or location data linked to your activity.
      class: border-l border-primary pl-4
    - title: AI-powered workout insights
      description: Our AI analyses your activity patterns to surface actionable recommendations — smarter training splits, recovery windows, and progression milestones tailored to you.
      class: border-l border-default pt-4 pl-4
    - title: Seamless goal tracking
      description: Set strength, endurance, or body-composition goals and watch your progress unfold through beautifully clear charts and weekly summaries — all stored locally on your device.
      class: border-l border-default pt-4 pl-4
features:
  title: Everything you need to train [smarter]{.text-primary}
  description: Powerful tools built with your privacy at the core, so you can focus entirely on your fitness.
  features:
    - title: Anonymous Workout Logging
      description: Log any exercise — weights, cardio, yoga, HIIT — without attaching your identity. Your data stays on your device.
      icon: i-lucide-shield-check
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: AI Fitness Coach
      description: Get real-time coaching suggestions based on your performance history, with zero data leaving your device.
      icon: i-lucide-wand-sparkles
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Smart Progress Charts
      description: Visualise strength gains, cardio improvements, and personal records with beautiful, auto-generated dashboards.
      icon: i-lucide-chart-line
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Anonymous Community Challenges
      description: Compete in weekly leaderboards and challenges using only your chosen alias — no real names, ever.
      icon: i-lucide-trophy
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Custom Workout Plans
      description: Build tailored training programs or let our AI generate one from your goals and available equipment.
      icon: i-lucide-dumbbell
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
    - title: Recovery & Rest Tracking
      description: Monitor sleep quality and rest days to keep overtraining at bay and stay injury-free.
      icon: i-lucide-moon
      ui:
        leading: bg-accented/50 p-2 rounded-md border border-muted border-dashed
steps:
  title: Start training smarter in [3 steps]{.text-primary}
  description: Get up and running in minutes — no personal information required.
  items:
    - title: Create your alias
      description: Pick an alias and a passphrase — that is all we need. No email, no phone number, no social login. You are completely anonymous from day one.
      image:
        light: '/images/light/connect.svg'
        dark: '/images/dark/connect.svg'
    - title: Log your first workout
      description: Choose from hundreds of exercises or build your own. Log sets, reps, duration, and notes. Everything is encrypted and stored locally on your device.
      image:
        light: '/images/light/optimize.svg'
        dark: '/images/dark/optimize.svg'
    - title: Track your progress
      description: Watch your strength and endurance climb session by session. Let our AI surface trends and suggest when to push harder or take a rest day.
      image:
        light: '/images/light/track.svg'
        dark: '/images/dark/track.svg'
pricing:
  title: Simple, transparent [pricing]{.text-primary}
  description: No hidden fees, no data harvesting. Choose the plan that fits your training goals and upgrade or cancel any time.
  plans:
    - title: Starter
      description: Everything you need to begin your anonymous fitness journey.
      price: $0
      billing_period: forever
      billing_cycle: free
      features:
        - Unlimited anonymous workout logging
        - Up to 5 custom workout plans
        - Basic progress charts and personal records
        - Access to community challenges
        - Local device storage with encrypted backups
        - Community support
      button:
        label: Get started free
        color: neutral
        variant: outline
        to: '#'
    - title: Pro
      description: Unlock the full power of AI-driven fitness coaching.
      price: $9
      billing_period: per month
      billing_cycle: billed monthly
      highlight: true
      features:
        - Everything in Starter
        - Unlimited custom workout plans
        - AI-powered workout recommendations
        - Advanced analytics and trend reports
        - Recovery and rest day coaching
        - Anonymous community leaderboards
        - Priority support
      button:
        label: Start free trial
        variant: subtle
        to: '#'
testimonials:
  title: Loved by athletes who value their [privacy]{.text-primary}
  description: Real results from real people — no names required.
  items:
    - quote: I've tried every fitness app out there but Fitanon is the first one I actually trust. Knowing my data never leaves my phone makes every workout feel more personal.
      user:
        name: 'Runner_88'
        description: 'Marathon enthusiast'
        to: '#'
        target: _blank
        avatar:
          src: 'https://api.dicebear.com/9.x/thumbs/svg?seed=Runner88'
    - quote: The AI coaching suggestions are surprisingly accurate. Within two weeks it identified that I was overtraining my shoulders and adjusted my split automatically.
      user:
        name: 'IronAnon'
        description: 'Powerlifter'
        to: '#'
        target: _blank
        avatar:
          src: 'https://api.dicebear.com/9.x/thumbs/svg?seed=IronAnon'
    - quote: Community challenges without leaderboards linked to real profiles is a game changer. I'm finally competing on merit rather than social clout.
      user:
        name: 'ZenLift'
        description: 'Yoga & strength training'
        to: '#'
        target: _blank
        avatar:
          src: 'https://api.dicebear.com/9.x/thumbs/svg?seed=ZenLift'
    - quote: I switched from a well-known app that sold my data to advertisers. With Fitanon I get better features and sleep easy knowing my health data is mine alone.
      user:
        name: 'StealthFit'
        description: 'HIIT & functional fitness'
        to: '#'
        target: _blank
        avatar:
          src: 'https://api.dicebear.com/9.x/thumbs/svg?seed=StealthFit'
    - quote: As a personal trainer I recommend Fitanon to every client who is worried about their health data being misused. The progress charts are the best I've seen.
      user:
        name: 'CoachGhost'
        description: 'Certified Personal Trainer'
        to: '#'
        target: _blank
        avatar:
          src: 'https://api.dicebear.com/9.x/thumbs/svg?seed=CoachGhost'
    - quote: Hit my first sub-20 5K using the Fitanon AI training plan. Never thought an anonymous app could feel this personalised.
      user:
        name: 'SpeedDemon_K'
        description: 'Amateur triathlete'
        to: '#'
        target: _blank
        avatar:
          src: 'https://api.dicebear.com/9.x/thumbs/svg?seed=SpeedDemonK'
cta:
  title: Start your anonymous fitness journey [today]{.text-primary}
  description: Join thousands of athletes who train hard and keep their data private. No email required — just an alias and a goal.
  links:
    - label: Get started free
      to: '#pricing'
      trailingIcon: i-lucide-arrow-right
    - label: Learn more
      to: '#features'
      variant: subtle
      icon: i-lucide-info
